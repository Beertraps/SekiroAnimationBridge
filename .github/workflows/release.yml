name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # uv prepares the conversion Python on the user's first start. Pinned with its published checksum.
  UV_VERSION: '0.12.23'
  UV_SHA256: '75d05de6762778c31ee183398de7dd15093fad0ed90b1f236d8205ea5ec00c90'

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The Unreal decoder's CUE4Parse needs the .NET 10 SDK; the bridge's decoders build with .NET 9.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Check the version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build the decoder
        run: ./tools/SekiroMotionDecoder/build_decoder.ps1 -SoulsAssetPipelineRoot "$env:RUNNER_TEMP\SoulsAssetPipeline" -OutputDirectory "$env:RUNNER_TEMP\decoder" -ArtifactsDirectory "$env:RUNNER_TEMP\decoder-build"

      - name: Build the RE Engine decoder
        run: ./packages/re_engine/decoder/build_decoder.ps1 -REELibRoot "$env:RUNNER_TEMP\REE-Lib" -OutputDirectory "$env:RUNNER_TEMP\re-decoder" -ArtifactsDirectory "$env:RUNNER_TEMP\re-decoder-build"

      - name: Build the Unreal decoder
        # The runner has CMake and the C++ build tools, so the decoder carries the native ACL library.
        run: ./packages/unreal/decoder/build_decoder.ps1 -CUE4ParseRoot "$env:RUNNER_TEMP\CUE4Parse" -OutputDirectory "$env:RUNNER_TEMP\unreal-decoder" -ArtifactsDirectory "$env:RUNNER_TEMP\unreal-decoder-build"

      - name: Prepare the .NET runtime
        run: ./tools/prepare_dotnet_runtime.ps1 -OutputDirectory "$env:RUNNER_TEMP\dotnet-runtime"

      - name: Download uv
        run: |
          $zip = "$env:RUNNER_TEMP\uv.zip"
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:UV_SHA256) { throw 'The uv download does not match the pinned checksum.' }
          Expand-Archive $zip "$env:RUNNER_TEMP\uv"
          Invoke-WebRequest "https://raw.githubusercontent.com/astral-sh/uv/$env:UV_VERSION/LICENSE-MIT" -OutFile "$env:RUNNER_TEMP\uv\LICENSE-MIT"

      - name: Package
        run: |
          python tools/package_addon.py
          python tools/package_release.py --output "dist/SekiroAnimationBridge-$env:VERSION-win-x64.zip" --decoder "$env:RUNNER_TEMP\decoder" --dotnet-runtime "$env:RUNNER_TEMP\dotnet-runtime" --uv "$env:RUNNER_TEMP\uv"
          if ($LASTEXITCODE) { throw 'Packaging failed.' }
          # Each game package is a separate asset; users install it on the Setup page.
          $packages = @(
            @{ id = 're_engine'; env = 'RE_ENGINE_PACKAGE'; tools = @("decoder=$env:RUNNER_TEMP\re-decoder") },
            @{ id = 'unreal'; env = 'UNREAL_PACKAGE'; tools = @("decoder=$env:RUNNER_TEMP\unreal-decoder") },
            @{ id = 'doom_eternal'; env = 'DOOM_ETERNAL_PACKAGE'; tools = @() }
          )
          foreach ($p in $packages) {
            $version = (Get-Content "packages/$($p.id)/package.json" -Raw | ConvertFrom-Json).version
            $package = "dist/AnimationBridge-package-$($p.id)-$version.zip"
            $toolArgs = @($p.tools | ForEach-Object { '--tool', $_ })
            python tools/package_game_package.py "packages/$($p.id)" --output $package @toolArgs
            if ($LASTEXITCODE) { throw "Packaging the $($p.id) package failed." }
            "$($p.env)=$((Resolve-Path $package).Path)" >> $env:GITHUB_ENV
          }
          Copy-Item SekiroRetargetAssistant-*.zip dist/

      - name: Test the release ZIP on a fresh profile
        timeout-minutes: 15
        run: |
          Expand-Archive "dist/SekiroAnimationBridge-$env:VERSION-win-x64.zip" "$env:RUNNER_TEMP\unpacked"
          $root = "$env:RUNNER_TEMP\unpacked\SekiroAnimationBridge-$env:VERSION"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\profile"
          # setup-dotnet sets DOTNET_ROOT; without it the bridge points its tools at the ZIP's dotnet-runtime folder.
          Remove-Item Env:DOTNET_ROOT, Env:DOTNET_ROOT_X64 -ErrorAction SilentlyContinue
          # First start, as a user would run it: the launcher prepares Python, then starts the UI.
          & "$root\Start Animation Bridge.cmd" --no-browser
          if ($LASTEXITCODE) { throw "The launcher failed with exit code $LASTEXITCODE." }
          $instance = "$env:LOCALAPPDATA\SekiroAnimationBridge\ui-instance.json"
          for ($i = 0; -not (Test-Path $instance) -and $i -lt 60; $i++) { Start-Sleep 1 }
          $ui = Get-Content $instance -Raw | ConvertFrom-Json
          $headers = @{ 'X-Bridge-Token' = $ui.token }
          $checks = Invoke-RestMethod "$($ui.base)/api/environment" -Headers $headers
          $checks | Format-Table key, ready, detail -AutoSize | Out-String | Write-Host
          foreach ($key in 'writer', 'decoder') {
            if (-not ($checks | Where-Object { $_.key -eq $key -and $_.ready })) { throw "The $key check failed." }
          }
          $config = (Invoke-RestMethod "$($ui.base)/api/state" -Headers $headers).config
          if ($config.decoder -ne "$root\decoder\SekiroMotionDecoder.exe") { throw "Unexpected decoder: $($config.decoder)" }
          # Install each game package from its ZIP, as a user does on the Setup page. The RE Engine decoder runs on the
          # shared runtime; the Unreal decoder carries its own.
          foreach ($zip in $env:RE_ENGINE_PACKAGE, $env:UNREAL_PACKAGE, $env:DOOM_ETERNAL_PACKAGE) {
            $install = @{ zip = $zip; confirm = $true } | ConvertTo-Json
            Invoke-RestMethod "$($ui.base)/api/packages/install" -Method Post -Headers $headers -ContentType 'application/json' -Body $install |
              ConvertTo-Json -Depth 5 -Compress | Write-Host
          }
          $checks = Invoke-RestMethod "$($ui.base)/api/environment" -Headers $headers
          $checks | Format-Table key, ready, detail -AutoSize | Out-String | Write-Host
          foreach ($key in 'package:re_engine:decoder', 'package:unreal:decoder') {
            if (-not ($checks | Where-Object { $_.key -eq $key -and $_.ready })) { throw "The $key check failed." }
          }
          Invoke-RestMethod "$($ui.base)/api/shutdown" -Method Post -Headers $headers -ContentType 'application/json' -Body '{}' | Out-Null
          # Spline export runs Soulstruct Havok's 32-bit CompressAnim.exe, which needs the Visual C++ 2010 runtime.
          # Install it from Microsoft, as the README tells users, so the unit tests cover spline export too.
          $redist = "$env:RUNNER_TEMP\vcredist_x86.exe"
          Invoke-WebRequest 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe' -OutFile $redist
          $signature = Get-AuthenticodeSignature $redist
          Write-Host "vcredist_x86.exe: $($signature.Status), $($signature.SignerCertificate.Subject), SHA256 $((Get-FileHash $redist).Hash)"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Unexpected signature on vcredist_x86.exe.' }
          $install = Start-Process $redist -ArgumentList '/q', '/norestart' -Wait -PassThru
          if ($install.ExitCode -notin 0, 1638, 3010) { throw "The Visual C++ 2010 runtime did not install: $($install.ExitCode)." }
          if (-not (Test-Path "$env:SystemRoot\SysWOW64\msvcr100.dll")) { throw 'msvcr100.dll is still missing.' }
          Push-Location $root
          & "$env:LOCALAPPDATA\SekiroAnimationBridge\writer-env\Scripts\python.exe" -E -X utf8 -m unittest discover -s standalone/tests -p "test_*.py"
          if ($LASTEXITCODE) { throw 'The unit tests failed.' }
          Pop-Location
          # The bridge ZIP holds no packages, so the packages' own tests run in the checkout.
          Push-Location $env:GITHUB_WORKSPACE
          foreach ($id in 're_engine', 'unreal', 'doom_eternal') {
            & "$env:LOCALAPPDATA\SekiroAnimationBridge\writer-env\Scripts\python.exe" -E -X utf8 -m unittest discover -s "packages/$id/tests"
            if ($LASTEXITCODE) { throw "The $id package tests failed." }
          }
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: SekiroAnimationBridge-${{ env.VERSION }}
          path: dist/

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changes = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^# ')[1]
          $changes = $changes.Substring($changes.IndexOf("`n") + 1).Trim()
          $addon = (Get-ChildItem dist/SekiroRetargetAssistant-*.zip).Name
          $package = (Get-ChildItem dist/AnimationBridge-package-re_engine-*.zip).Name
          $unreal = (Get-ChildItem dist/AnimationBridge-package-unreal-*.zip).Name
          $doom = (Get-ChildItem dist/AnimationBridge-package-doom_eternal-*.zip).Name
          $notes = @"
          ## Install

          1. Download **SekiroAnimationBridge-$env:VERSION-win-x64.zip**, extract it and double-click **Start Animation Bridge.cmd**. The first start prepares the conversion Python; it needs an internet connection and takes a few minutes.
          2. Install [Blender 4.5](https://www.blender.org/download/lts/4-5/) if you do not have it. The bridge finds standard installations; otherwise choose ``blender.exe`` under **Settings & setup**.
          3. Optional: install **$addon** in Blender to retarget animations between characters.
          4. Optional: to import other games, download their package and install it with **Install package…** under **Settings & setup**: **$package** for Devil May Cry 5, **$unreal** for Unreal Engine 4 and 5 games (experimental), **$doom** for DOOM Eternal (experimental).

          No game files are included. KRAK-compressed archives need ``oo2core_6_win64.dll``: the bridge uses the one in your Sekiro folder or the copy that comes with Soulstruct, or asks for it. The optional *Spline* export format needs the [Microsoft Visual C++ 2010 Redistributable (x86)](https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist#visual-studio-2010-vc-100-sp1-no-longer-supported); **Settings & setup** shows whether it is installed.

          ## Changes

          $changes
          "@
          $notes | Set-Content "$env:RUNNER_TEMP\notes.md" -Encoding utf8
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --verify-tag --title "Animation Bridge $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md"
